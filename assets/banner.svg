<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shubham Parmar, Problem Solver specializing in Algorithms and Data Structures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#13293d"/>
      <stop offset="100%" stop-color="#1b4965"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <style>
      .name    { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; letter-spacing: 1px; }
      .role    { font: 500 24px 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace; fill: #38bdf8; }
      .tagline { font: 400 19px 'SFMono-Regular', Consolas, Menlo, 'Courier New', monospace; fill: #fff; fill-opacity: .7; letter-spacing: 1px; }

      .fade { animation: fadeUp 1s ease-out both; }
      .d2 { animation-delay: .35s; } .d3 { animation-delay: .7s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

      .edge { stroke: #38bdf8; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 6 8; animation: flow 4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }

      .node { fill: #38bdf8; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.7); opacity: 1; } }

      .b { fill: url(#bar); fill-opacity: .75; transform-box: fill-box; transform-origin: bottom; animation: sort 3.2s ease-in-out infinite; }
      .b1 { animation-delay: 0s; } .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; }
      .b5 { animation-delay: 1.2s; } .b6 { animation-delay: 1.5s; } .b7 { animation-delay: 1.8s; } .b8 { animation-delay: 2.1s; }
      @keyframes sort { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.35); } }

      .float { animation: float 7s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

      .shine { animation: shine 3.5s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-50px); opacity: 0; } 20%,80% { opacity: 1; } 100% { transform: translateX(50px); opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <g class="float">
    <circle cx="1040" cy="90" r="170" fill="url(#glow)"/>
  </g>
  <circle cx="130" cy="290" r="130" fill="url(#glow)" opacity=".6"/>

  <!-- graph, left -->
  <g>
    <line class="edge" x1="70" y1="60" x2="190" y2="120"/>
    <line class="edge" x1="190" y1="120" x2="100" y2="210"/>
    <line class="edge" x1="100" y1="210" x2="250" y2="260"/>
    <line class="edge" x1="190" y1="120" x2="280" y2="50"/>
    <line class="edge" x1="70" y1="60" x2="280" y2="50"/>
    <line class="edge" x1="100" y1="210" x2="40" y2="295"/>
    <line class="edge" x1="190" y1="120" x2="250" y2="260"/>
    <circle class="node" cx="70" cy="60" r="5"/>
    <circle class="node n2" cx="190" cy="120" r="6"/>
    <circle class="node n3" cx="100" cy="210" r="5"/>
    <circle class="node n4" cx="250" cy="260" r="5"/>
    <circle class="node n5" cx="280" cy="50" r="4"/>
    <circle class="node n3" cx="40" cy="295" r="4"/>
  </g>

  <!-- graph, right -->
  <g>
    <line class="edge" x1="930" y1="60" x2="1040" y2="110"/>
    <line class="edge" x1="1040" y1="110" x2="1130" y2="50"/>
    <line class="edge" x1="1040" y1="110" x2="1100" y2="190"/>
    <line class="edge" x1="1100" y1="190" x2="960" y2="190"/>
    <line class="edge" x1="1040" y1="110" x2="960" y2="190"/>
    <line class="edge" x1="930" y1="60" x2="960" y2="190"/>
    <circle class="node n2" cx="930" cy="60" r="5"/>
    <circle class="node" cx="1040" cy="110" r="6"/>
    <circle class="node n4" cx="1130" cy="50" r="4"/>
    <circle class="node n3" cx="1100" cy="190" r="5"/>
    <circle class="node n5" cx="960" cy="190" r="5"/>
  </g>

  <!-- sorting bars, bottom right -->
  <g>
    <rect class="b b1" x="930"  y="240" width="20" height="60" rx="3"/>
    <rect class="b b2" x="960"  y="225" width="20" height="75" rx="3"/>
    <rect class="b b3" x="990"  y="250" width="20" height="50" rx="3"/>
    <rect class="b b4" x="1020" y="215" width="20" height="85" rx="3"/>
    <rect class="b b5" x="1050" y="245" width="20" height="55" rx="3"/>
    <rect class="b b6" x="1080" y="230" width="20" height="70" rx="3"/>
    <rect class="b b7" x="1110" y="255" width="20" height="45" rx="3"/>
    <rect class="b b8" x="1140" y="220" width="20" height="80" rx="3"/>
  </g>

  <text x="600" y="140" text-anchor="middle" class="name fade">Shubham Parmar</text>
  <text x="600" y="190" text-anchor="middle" class="role fade d2">Problem Solver · Algorithms &amp; Data Structures</text>
  <text x="600" y="230" text-anchor="middle" class="tagline fade d3">Think. Code. Optimize. Repeat.</text>
  <rect x="540" y="254" width="120" height="3" rx="1.5" fill="#38bdf8" fill-opacity=".25"/>
  <rect class="shine" x="570" y="254" width="60" height="3" rx="1.5" fill="#38bdf8"/>
</svg>
