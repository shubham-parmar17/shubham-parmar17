<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dot { animation: slide 6s ease-in-out infinite alternate; }
      @keyframes slide { from { transform: translateX(-380px); } to { transform: translateX(380px); } }
    </style>
  </defs>
  <rect x="100" y="11" width="1000" height="2" fill="url(#l)"/>
  <circle class="dot" cx="600" cy="12" r="4" fill="#38bdf8"/>
</svg>
